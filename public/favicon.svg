<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Kairos</title>
  <!-- Les ailes de Kairos (d'après la fresque de Salviati) sur un court en dur vert et bleu. -->
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f63b8"/>
      <stop offset="1" stop-color="#3e7d57"/>
    </linearGradient>
    <!-- Aile : bord d'attaque courbe, bord de fuite festonné (une bosse par plume). -->
    <path id="wing" d="M250 900 Q190 330 800 120 Q835 218 734 244 Q771 336 675 363 Q712 450 622 479 Q660 560 575 590 Q613 666 534 698 Q573 768 499 801 Q539 866 470 900 Z"/>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#court)"/>
  <!-- Aile arrière, estompée ; puis aile avant. Bandes crème, sauge, saumon depuis la racine. -->
  <g opacity=".75" transform="rotate(5 430 860) translate(230 45) scale(.82)">
    <use href="#wing" fill="#f3d9bf"/>
    <use href="#wing" fill="#a6bb9c" transform="translate(250 900) scale(.74) translate(-250 -900)"/>
    <use href="#wing" fill="#e48f76" transform="translate(250 900) scale(.52) translate(-250 -900)"/>
    <use href="#wing" fill="#f3d9bf" transform="translate(250 900) scale(.3) translate(-250 -900)"/>
  </g>
  <g transform="rotate(-6 220 870) translate(-20 150) scale(.8)">
    <use href="#wing" fill="#fff3e2"/>
    <use href="#wing" fill="#b9cbb0" transform="translate(250 900) scale(.74) translate(-250 -900)"/>
    <use href="#wing" fill="#efa58c" transform="translate(250 900) scale(.52) translate(-250 -900)"/>
    <use href="#wing" fill="#fff3e2" transform="translate(250 900) scale(.3) translate(-250 -900)"/>
  </g>
</svg>
