name: Release

# Publication d'une version : pousser un tag `vX.Y.Z` (identique à la version
# de package.json, tauri.conf.json et Cargo.toml) crée une release GitHub en
# brouillon, avec les installateurs des trois OS. Le brouillon est relu, puis
# publié à la main depuis GitHub (binaires non signés : voir docs/INSTALLATION.md).
#
# Lancement manuel (Actions > Release > Run workflow) : choisir le tag `vX.Y.Z`
# dans « Use workflow from » et l'OS à reconstruire. Les installateurs sont joints
# à la release en brouillon de ce tag (créée si elle n'existe pas encore), sans
# reconstruire les autres OS. Le push d'un tag construit toujours les trois OS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      os:
        description: OS à construire
        type: choice
        options: [tous, macos, windows, linux]
        default: tous

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Le tag correspond à la version de l'application, et le code est vérifié.
  verify:
    name: Vérification de la version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Tag et version de l'application
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Lancer la release depuis un tag vX.Y.Z (« Use workflow from »), pas depuis la branche ${GITHUB_REF_NAME}."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${version} de package.json."
            exit 1
          fi
          if ! grep -q "## \[${version}\]" docs/CHANGELOG.md; then
            echo "::error::docs/CHANGELOG.md ne contient pas de section [${version}]."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Biome, TypeScript et Vitest (dont l'alignement des versions)
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test

  # Cibles de build : les trois OS, ou celui choisi lors d'un lancement manuel.
  targets:
    name: Cibles de build
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          OS: ${{ inputs.os || 'tous' }}
        # Windows : .msi (par machine, droits administrateur) et .exe NSIS (sans droits administrateur, §11.1).
        run: |
          all='[
            {"os": "macos", "name": "macOS Apple Silicon", "platform": "macos-latest",
             "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin --bundles dmg"},
            {"os": "macos", "name": "macOS Intel", "platform": "macos-latest",
             "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin --bundles dmg"},
            {"os": "windows", "name": "Windows", "platform": "windows-latest",
             "target": "", "args": "--bundles msi,nsis"},
            {"os": "linux", "name": "Linux", "platform": "ubuntu-22.04",
             "target": "", "args": "--bundles appimage,deb"}
          ]'
          echo "matrix=$(jq -c --arg os "$OS" '{include: [.[] | select($os == "tous" or .os == $os)]}' <<< "$all")" >> "$GITHUB_OUTPUT"

  # Release en brouillon, créée une seule fois avant les builds parallèles.
  create-release:
    name: Release en brouillon
    needs: verify
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            // Relance manuelle : les installateurs rejoignent le brouillon existant.
            // (getReleaseByTag ne voit pas les brouillons.)
            if (context.eventName === "workflow_dispatch") {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const existing = releases.find((r) => r.tag_name === tag);
              if (existing) {
                if (!existing.draft) {
                  throw new Error(`La release ${tag} est déjà publiée : la repasser en brouillon avant de la compléter.`);
                }
                return existing.id;
              }
            }
            // Notes de version : section du CHANGELOG correspondant au tag.
            const changelog = fs.readFileSync("docs/CHANGELOG.md", "utf8");
            const start = changelog.indexOf(`## [${version}]`);
            const next = changelog.indexOf("\n## [", start + 1);
            const notes = changelog.slice(start, next < 0 ? undefined : next).trim();
            const body = [
              notes,
              "",
              "### Installation",
              "",
              "Les installateurs ne sont pas signés : suivez la notice `docs/INSTALLATION.md` pour contourner l'alerte de macOS (Gatekeeper) ou de Windows (SmartScreen).",
              "",
              "- macOS Apple Silicon et Intel : `.dmg`",
              "- Windows 10/11 : `.exe` (installation sans droits administrateur) ou `.msi`",
              "- Linux : `.AppImage` ou `.deb`",
            ].join("\n");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Kairos ${version}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  # Installateurs des OS ciblés, joints à la release en brouillon.
  publish:
    name: Installateurs ${{ matrix.name }}
    needs: [targets, create-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dépendances système Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Pas de mise à jour automatique (§12.2) : aucun fichier latest.json.
          includeUpdaterJson: false
          args: ${{ matrix.args }}
