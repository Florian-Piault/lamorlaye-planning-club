[package]
name = "planning-club"
version = "1.0.0"
description = "Planning des cours collectifs du club de tennis"
authors = ["Florian PIAULT"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "planning_club_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Dialogues natifs « Enregistrer sous » / « Ouvrir » (export et restauration des sauvegardes).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mêmes versions que celles utilisées par tauri-plugin-sql, pour partager son pool.
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
thiserror = "2"
# Ouverture des fichiers exportés dans l'application par défaut (lecteur PDF…),
# appelée uniquement côté Rust (`output.rs`) : aucune permission accordée au front.
tauri-plugin-opener = "2"
# Chiffrement des sauvegardes exportées par mot de passe (`crypto.rs`) :
# AES-256-GCM, clé dérivée du mot de passe par Argon2id (RustCrypto).
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
